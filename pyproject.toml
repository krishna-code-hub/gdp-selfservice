[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gdp-self-service-kit"
version = "0.1.0"
description = "Local, bounded knowledge retrieval for GDP GitHub Copilot agents"
requires-python = ">=3.11,<3.14"
dependencies = [
  "chromadb>=1.1,<2",
  "httpx>=0.28,<1",
  "PyYAML>=6.0.2,<7",
  "filelock>=3.19,<4",
  "tiktoken>=0.11,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.13,<1"]

[project.scripts]
gdp-support = "gdp_support.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/gdp_support"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
